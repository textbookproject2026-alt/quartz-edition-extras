# The textbook's design values: every book on the builder, and every edition
# that pins this plugin, looks like this file says.
#
# It is read when a book builds, not when the plugin is compiled, so changing a
# value here needs no `npm run build`. A value that isn't a plain colour, size
# or number fails the build with the key's name, rather than breaking the page.
#
# Seeded on 23 Sep 2026 from book one's publish.css. Palette and fonts replaced
# on 2 Oct 2026 from Brandon's draft "Confused4Now fonts and colours" and his
# landing-page draft (visual direction v3): white, near-black, grey, a light
# hairline, deep olive, light olive, brown. The dark values are the draft's
# own (the olives and the brown lifted, on #17181C). Values the draft left
# out (accentHover, accentWash, faint, backgroundSoft, mark) are derived from
# the draft's own hues. The same palette is in textbook-portal/src/styles.css.
#
# Contrast (WCAG, checked 2 Oct 2026): light ink 16.1, accent 7.7, muted 6.1
# on white; dark ink 14.7, accent 6.9, muted 6.7 on #17181C. accentSoft is
# 3.0:1 on white, so it is decoration only, never text.

palette:
  light:
    accent: "#52562F" # deep olive: links, active nav, buttons, the graph's current page
    accentHover: "#353820" # derived: the accent, darker
    accentSoft: "#9B9569" # light olive: decoration only (link underlines, hover tints)
    accentWash: "#F0EFE8" # derived: light olive at low strength on white
    heading: "#202124"
    ink: "#202124" # body text
    muted: "#5F6368" # captions, secondary text, the controls row
    faint: "#9AA0A6" # placeholders, disabled, the graph's other pages
    border: "#DADCE0" # hairline
    background: "#FFFFFF"
    backgroundSoft: "#F1F3F4" # code, chips
    mark: "#FDF2B3" # ==highlighted text==
  dark:
    accent: "#A7A374"
    accentHover: "#D6D3B5"
    accentSoft: "#C7C39B"
    accentWash: "rgba(167, 163, 116, 0.16)"
    heading: "#E8EAED"
    ink: "#E8EAED"
    muted: "#9AA0A6"
    faint: "#5F6368"
    border: "#3C4043"
    background: "#17181C"
    backgroundSoft: "#202124"
    mark: "rgba(253, 242, 179, 0.22)"

# Dark mode follows the reader's system setting until they use the toggle
# (quartz-book's darkmode plugin); each site remembers its own choice. Print
# always uses the light palette.
darkMode: true

# Hypothes.is highlights: the light olive at low alpha, so dark text on it
# stays readable in both themes.
annotation:
  highlight: "rgba(155, 149, 105, 0.30)"
  focused: "rgba(155, 149, 105, 0.50)"

# Google Fonts family names. text: the chapter's paragraphs, lists, quotes and
# tables. ui: headings, nav, explorer, search, controls, buttons, the editor.
fonts:
  text: Source Serif 4
  ui: Source Sans 3
  mono: JetBrains Mono

type:
  body: { size: 1.125rem, lineHeight: 1.65 } # 18px
  lead: { size: 1.25rem, lineHeight: 1.6 } # the paragraph right after a chapter's title
  h1: { size: 2.25rem, weight: 700, lineHeight: 1.15 }
  h2: { size: 1.75rem, weight: 700, lineHeight: 1.2 }
  h3: { size: 1.375rem, weight: 600, lineHeight: 1.3 }
  # h4 is the "keycap" heading: a real heading, set in tracked capitals.
  h4: { size: 1.125rem, weight: 600, lineHeight: 1.4, letterSpacing: 0.04em }
  linkWeight: 600
  # Below layout.mobileWidth. The lead paragraph drops to body size there too.
  mobile: { h1: 1.875rem, h2: 1.5rem, h3: 1.25rem }

layout:
  measure: 720px # the reading column
  rhythm: 1.5rem # paragraph spacing; headings get 2x (h2) and 1.5x (h3, h4) above
  mobileWidth: 768px
  # Quartz's phone layout (its $mobile breakpoint): at this width and below the
  # left sidebar becomes the header row. The compact header, the front page's
  # single title, the tidy controls row and the tap-to-load annotation client
  # all apply here, and nothing changes above it.
  narrowWidth: 800px

# The row under the title: Edit, History, Suggest, the annotation badge.
controls:
  size: 0.85rem

# The Confused for Now logo, linking to the portal above the book's title (the
# home-link plugin): the full logo at Quartz's desktop breakpoint (1200px) and
# up, the icon below it. Its colour is the palette's `heading` (Quartz's --dark,
# the text colour), and `accent` on hover and focus.
homeLink:
  height: 32px
  iconHeight: 28px

# Printing hides everything but the chapter, and prints no annotation highlights.
print:
  size: 11pt
  lineHeight: 1.5
  margin: 2cm
